<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WipkoERP v032 - Diagram Maker</title>
  <link rel="preload" href="diagram-header.png" as="image" />
  <link rel="preload" href="diagram-footer.png" as="image" />
  <link rel="preload" href="diagram-watermark-logo.svg" as="image" />
  <link rel="stylesheet" href="diagram-maker.css?v=28" />

  <style id="v029-layout">
    .diagram-bottom-schedule{grid-column:1/-1;margin:12px 14px 16px!important;padding:12px 16px!important}
    .diagram-bottom-schedule h3{margin:0 0 8px!important}
    .diagram-bottom-schedule #cameraSchedule table{width:100%;border-collapse:collapse;font-size:15px;font-weight:700}
    .diagram-bottom-schedule #cameraSchedule th,.diagram-bottom-schedule #cameraSchedule td{padding:8px 12px;border-bottom:1px solid #dbe4ef;text-align:left}
    .diagram-bottom-schedule .camera-totals{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:16px;font-weight:800;color:#0b2238}
    .layer-select-box{width:16px;height:16px;margin-right:6px;vertical-align:middle}
    .layer-actions.v028-group-actions{margin-top:8px}
    .v028-group-tag{font-size:9px;font-weight:800;color:#1769ff;margin-left:5px;flex:0 0 auto}
    #layersList .layer-row{display:grid!important;grid-template-columns:18px minmax(0,1fr) 28px 28px!important;align-items:center!important;gap:5px!important;min-height:34px!important;padding:4px 5px!important}
    #layersList .layer-select-box{grid-column:1;width:15px!important;height:15px!important;margin:0!important}
    #layersList .layer-name{grid-column:2;min-width:0!important;display:flex!important;align-items:center!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:12px!important;font-weight:600!important}
    #layersList button[data-eye],#layersList button[data-lock]{width:28px!important;min-width:28px!important;height:28px!important;min-height:28px!important;padding:0!important;margin:0!important;border-radius:7px!important;font-size:13px!important;display:grid!important;place-items:center!important}
    #layersList button[data-eye]{grid-column:3}#layersList button[data-lock]{grid-column:4}
    .diagram-bottom-schedule{display:none!important}
    #status{display:none!important}
  </style>
</head>
<body>
  <header class="topbar topbar-v34">
    <div class="brand">Diagram Maker <small>v032</small></div>
    <div class="toolbar toolbar-v34">
      <div class="tool-group">
        <button id="newBtn">New</button>
        <button id="addPageBtn">+ Page</button>
        <select id="pageSelect" title="Pages"><option value="0">Page 1</option></select>
        <button id="deletePageBtn" class="icon-btn" title="Delete Page" aria-label="Delete Page">🗑</button>
        <button id="zoomOutBtn" class="icon-btn" title="Zoom out">−</button>
        <button id="zoomInBtn" class="icon-btn" title="Zoom in">+</button>
        <button id="fitBtn">Fit</button>
      </div>
      <button id="moreToolbarBtn" class="more-btn" type="button" aria-expanded="false">More ▾</button>
      <div class="doc-group" id="docControls">
        <input id="clientName" list="clientOptions" placeholder="Search client…" autocomplete="off" title="Client"><datalist id="clientOptions"></datalist>
        <select id="savedDiagramSelect" title="Saved Diagram"><option value="">Saved diagram…</option></select>
        <button id="loadClientDiagramBtn" type="button" title="Load saved diagram">Load</button>
        <button id="saveClientBtn" type="button" class="primary" title="Save diagram">Save</button>
        <button id="pdfBtn" class="primary" title="Export PDF">PDF</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar left">
      <h3>Components</h3>
      <button class="tool active" data-tool="select">↖ Select</button>
      <button class="tool" data-tool="hand">✋ Hand / Pan</button>
      <button class="tool" data-tool="camera">📹 Add Camera</button>
      <label class="side-file-btn insert-image-btn">🖼 Insert Image<input id="imageInput" type="file" accept="image/*" hidden></label>
      <button class="tool" data-tool="wall">／ Draw Wall</button>
      <button class="tool" data-tool="square">▭ Insert Square</button>
      <button class="tool" data-tool="door"><svg class="tool-svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V4h10v16M5 20h14M15 20V7M15 7c3 0 5 2 5 5"/><path class="door-arc" d="M15 20a7 7 0 0 0 7-7"/></svg> Insert Door</button>
      <button class="tool" data-tool="measure"><svg class="tool-svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 8v8M21 8v8M7 9l-4 3 4 3M17 9l4 3-4 3"/></svg> Insert Length Arrow</button>
      <button class="tool" data-tool="road"><svg class="tool-svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z" fill="currentColor" stroke="none"/><path d="M5 8h14M5 16h14M6 12h3M11 12h3M16 12h2" stroke="#fff"/></svg> Insert Road Line</button>
      <button class="tool" data-tool="text">T Add Text</button>
      <button id="duplicateBtnSide">⧉ Duplicate Selected</button>
      <button id="deleteBtn" class="danger">Delete Selected</button>

      <div class="panel">
        <h3>View</h3>
        <label><input id="gridToggle" type="checkbox" checked> Show grid</label>
        <label><input id="snapToggle" type="checkbox" checked> Snap to grid</label>
        <label>Grid size <input id="gridSize" type="number" value="20" min="5" max="100"></label>
      </div>

      <div hidden><select id="paperSize"><option value="A3" selected>A3 Landscape</option></select><input id="projectName"><input id="siteLocation"><input id="drawingNo"><input id="preparedBy"><input id="drawingDate" type="date"></div>
    </aside>

    <section class="workspace-wrap">
      <canvas id="canvas" width="1123" height="1588"></canvas>
      <div id="status" hidden aria-hidden="true">Ready</div>
    </section>

    <aside class="sidebar right">
      <h3>Properties</h3>
      <div id="emptyProps" class="muted">Select an object to edit its properties.</div>
      <div id="cameraProps" class="properties hidden">
        <label>Camera ID <input id="camId"></label>
        <label>Type
          <select id="camType">
            <option>Bullet</option><option>Dome</option><option>PTZ</option><option>Fisheye</option><option>ANPR</option>
          </select>
        </label>
        <input id="camLocation" type="hidden">
        <label>Resolution <input id="camResolution" value="4 MP"></label>
        <label>Lens <input id="camLens" value="2.8 mm"></label>
        <label>Direction <input id="camAngle" type="range" min="0" max="359"><span id="camAngleVal"></span></label>
        <label>View angle <input id="camFov" type="range" min="10" max="170"><span id="camFovVal"></span></label>
        <label>Range <input id="camRange" type="range" min="40" max="600"><span id="camRangeVal"></span></label>
        <label>Opacity <input id="camOpacity" type="range" min="10" max="80"><span id="camOpacityVal"></span></label>
        <label>Cone colour <input id="camColor" type="color" value="#66aaff"></label>
        <label><input id="showLabel" type="checkbox" checked> Show label</label>
      </div>

      <div id="imageProps" class="properties hidden">
        <label>Width <input id="imageWidth" type="number" min="20"></label>
        <label>Height <input id="imageHeight" type="number" min="20"></label>
        <label class="inline-check"><input id="lockImageRatio" type="checkbox" checked> Lock aspect ratio</label>
        <label>Rotate <input id="imageAngle" type="range" min="-180" max="180" value="0"><span id="imageAngleVal">0°</span></label>
        <div class="crop-grid"><label>Crop Left %<input id="cropLeft" type="number" min="0" max="90" value="0"></label><label>Crop Right %<input id="cropRight" type="number" min="0" max="90" value="0"></label><label>Crop Top %<input id="cropTop" type="number" min="0" max="90" value="0"></label><label>Crop Bottom %<input id="cropBottom" type="number" min="0" max="90" value="0"></label></div>
        <button id="resetCropBtn" type="button" class="prop-btn">Reset Crop</button>
      </div>
      <div id="textProps" class="properties hidden">
        <label>Text <textarea id="textValue" rows="4"></textarea></label>
        <label>Font size <input id="textSize" type="number" min="8" max="72" value="18"></label>
      </div>
      <div id="lineProps" class="properties hidden">
        <label>Line width <input id="lineWidth" type="number" min="1" max="15" value="3"></label>
        <label>Line colour <input id="lineColor" type="color" value="#333333"></label>
      </div>
      <div id="measureProps" class="properties hidden">
        <label>Length Text <input id="measureText" placeholder="Type length, e.g. 5.2 m"></label>
        <label>Line width <input id="measureWidth" type="number" min="1" max="15" value="3"></label>
        <label>Line colour <input id="measureColor" type="color" value="#111111"></label>
      </div>
      <div id="roadProps" class="properties hidden">
        <label>Road width <input id="roadWidth" type="number" min="4" max="200" value="14"></label>
      </div>


      <div class="panel layers-panel">
        <h3>Layers</h3>
        <div class="layer-actions"><button id="bringFrontBtn" type="button">Front</button><button id="bringForwardBtn" type="button">Forward</button><button id="sendBackwardBtn" type="button">Backward</button><button id="sendBackBtn" type="button">Back</button></div><div class="layer-actions v028-group-actions"><button id="groupSelectedBtn" type="button">Group Selected</button><button id="ungroupSelectedBtn" type="button">Ungroup</button></div>
        <div class="muted layer-help">Tick two or more layers, then Group Selected. Grouped items move together. Alt + click cycles overlapping objects.</div>
        <div id="layersList"></div>
      </div>

    </aside>
    <div id="cameraSchedule" hidden aria-hidden="true"></div>
  </main>

  <script src="diagram-maker.js?v=32"></script>
</body>
</html>
